<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>
  <body>
    <div id="Calculator_container">
      <div id="write_area"></div>
      <div class="calculator_row">
        <button>C</button>
        <button>DEL</button>
        <button>(</button>
        <button>)</button>
      </div>
      <div class="calculator_row">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>-</button>
      </div>
      <div class="calculator_row">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>+</button>
      </div>
      <div class="calculator_row">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>/</button>
      </div>
      <div class="calculator_row">
        <button>0</button>
        <button>.</button>
        <button>x²</button>
        <button>=</button>
      </div>
      <div class="calculator_row">
        <button>!</button>
        <button>*</button>
        </div>
    <script src="script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.0.1/math.min.js"></script>
  </body>
</html>
